<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telão — Correio Elegante · Entre Laços 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Cinzel:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  background:
    radial-gradient(ellipse 120% 80% at 50% 100%, #3D1F00 0%, #1A0800 50%, #0D0300 100%);
  font-family:'Lato',sans-serif;
  display:flex;flex-direction:column;
  position:relative;
}

/* ── VARAL REALISTA ── */
.string-lights{
  position:fixed;top:0;left:0;right:0;height:120px;
  pointer-events:none;z-index:2;
}
.string-lights svg{width:100%;height:120px;}

/* Animação de cintilação */
@keyframes bulbFlicker{
  0%,100%{opacity:1;}
  92%{opacity:1;}
  93%{opacity:0.6;}
  94%{opacity:1;}
  96%{opacity:0.8;}
  97%{opacity:1;}
}
@keyframes bulbFlicker2{
  0%,100%{opacity:0.85;}
  45%{opacity:0.85;}
  46%{opacity:0.4;}
  47%{opacity:0.85;}
}
.bulb-g1{animation:bulbFlicker 8s infinite;}
.bulb-g2{animation:bulbFlicker2 12s infinite 2s;}
.bulb-g3{animation:bulbFlicker 15s infinite 5s;}

/* ── FUNDO CAMPO/PÔRDO SOL ── */
.bg-scene{
  position:fixed;inset:0;z-index:0;
  background:
    linear-gradient(180deg,
      #0D0300 0%,
      #1A0800 15%,
      #3D1500 35%,
      #6B2D00 55%,
      #8B3E00 65%,
      #4A1A00 80%,
      #1A0500 100%);
}
/* Silhueta de arvores */
.trees{position:fixed;bottom:0;left:0;right:0;height:180px;z-index:1;pointer-events:none;}
.trees svg{width:100%;height:180px;}

/* Lua / sol no horizonte */
.horizon-glow{
  position:fixed;
  left:50%;transform:translateX(-50%);
  bottom:140px;
  width:300px;height:80px;
  background:radial-gradient(ellipse,rgba(200,120,0,0.3),transparent 70%);
  z-index:1;pointer-events:none;filter:blur(20px);
}

/* ── TOPO BAR ── */
.top-bar{
  position:fixed;top:0;left:0;right:0;height:60px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2.5rem;z-index:10;
  background:linear-gradient(180deg,rgba(13,3,0,0.8),transparent);
}
.top-brand{font-family:'Cinzel',serif;color:#C8963E;font-size:14px;letter-spacing:0.2em;text-transform:uppercase;}
.top-count{font-family:'Lato',sans-serif;font-size:12px;color:rgba(200,150,62,0.4);letter-spacing:0.12em;}

/* ── TELA AGUARDANDO ── */
#screen-waiting{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:5;
  text-align:center;padding:2rem;
}
.wait-envelope{
  width:120px;height:84px;margin:0 auto 2rem;
  animation:floatEnv 4s ease-in-out infinite;
}
@keyframes floatEnv{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-18px) rotate(1deg);}}
.wait-title{font-family:'Playfair Display',serif;font-style:italic;color:#F5E0B0;font-size:72px;margin-bottom:12px;text-shadow:0 4px 20px rgba(0,0,0,0.5);}
.wait-title span{color:#E9C46A;}
.wait-sub{font-family:'Cinzel',serif;color:rgba(200,150,62,0.5);font-size:14px;letter-spacing:0.3em;text-transform:uppercase;}

/* ── CARD MENSAGEM ── */
#screen-message{
  position:fixed;inset:0;display:none;
  align-items:center;justify-content:center;z-index:5;
  padding:8rem 4rem 5rem;
}
.msg-card{
  background:
    linear-gradient(145deg,rgba(44,18,0,0.96),rgba(65,28,0,0.93));
  border:1px solid #8B6000;
  max-width:900px;width:100%;
  padding:4rem;
  position:relative;
  box-shadow:
    0 0 0 1px rgba(139,96,0,0.3),
    0 0 60px rgba(200,120,0,0.08),
    0 40px 120px rgba(0,0,0,0.6);
  animation:cardReveal 1s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes cardReveal{
  from{opacity:0;transform:translateY(40px) scale(0.95);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
/* Ornamento nos cantos */
.msg-card::before,.msg-card::after{
  content:'';position:absolute;
  width:40px;height:40px;
  border-color:#8B6000;border-style:solid;
}
.msg-card::before{top:16px;left:16px;border-width:1px 0 0 1px;}
.msg-card::after{bottom:16px;right:16px;border-width:0 1px 1px 0;}

/* Lacre central (topo do card) */
.msg-seal{
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#6B0000,#8B1A1A);
  border:2px solid #C8963E;
  margin:0 auto 1.5rem;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
}
.msg-seal svg{width:28px;height:28px;}

.msg-para-label{
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.3em;
  color:#8B6000;text-transform:uppercase;text-align:center;margin-bottom:6px;
}
.msg-para{
  font-family:'Playfair Display',serif;font-style:italic;
  color:#E9C46A;font-size:38px;text-align:center;
  margin-bottom:2rem;line-height:1.2;
}

/* Linha divisória com ornamento */
.msg-divider{display:flex;align-items:center;gap:16px;margin-bottom:2rem;}
.msg-divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(139,96,0,0.5),transparent);}
.msg-divider-diamond{
  width:10px;height:10px;background:#C8963E;
  transform:rotate(45deg);flex-shrink:0;
  box-shadow:0 0 8px rgba(200,150,62,0.4);
}

.msg-texto{
  font-family:'Playfair Display',serif;font-style:italic;
  color:#F5E0B0;font-size:30px;line-height:1.65;
  text-align:center;margin-bottom:2.5rem;
}

.msg-assinatura{text-align:center;}
.msg-de{font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.25em;color:#8B6000;text-transform:uppercase;margin-bottom:5px;}
.msg-nome{font-family:'Playfair Display',serif;color:#E9C46A;font-size:26px;font-weight:700;}
.msg-setor{font-family:'Lato',sans-serif;font-size:13px;color:rgba(245,224,176,0.45);margin-top:3px;letter-spacing:0.08em;}

/* ── BARRA DE PROGRESSO ── */
.progress-wrap{position:fixed;bottom:0;left:0;right:0;height:4px;background:rgba(139,96,0,0.15);z-index:10;}
.progress-bar{height:4px;background:linear-gradient(90deg,#8B6000,#C8963E,#E9C46A);width:100%;}


/* ── PAINEL DE PERSONALIZAÇÃO ── */
#customizer{
  position:fixed;bottom:1rem;right:1rem;z-index:9999;
  font-family:'Lato',sans-serif;
}
#cust-toggle{
  background:rgba(0,0,0,0.78);color:#E9C46A;
  border:1px solid #8B6000;border-radius:999px;
  padding:8px 16px;font-size:12px;font-weight:700;
  cursor:pointer;letter-spacing:0.08em;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
  display:flex;align-items:center;gap:6px;
}
#cust-toggle:hover{background:rgba(0,0,0,0.95);}
#cust-panel{
  display:none;
  background:rgba(12,4,0,0.97);
  border:1px solid #8B6000;border-radius:12px;
  padding:1.25rem;width:300px;
  box-shadow:0 8px 40px rgba(0,0,0,0.7);
  margin-bottom:8px;max-height:90vh;overflow-y:auto;
}
#cust-panel.open{display:block;}
/* Scrollbar discreta */
#cust-panel::-webkit-scrollbar{width:4px;}
#cust-panel::-webkit-scrollbar-track{background:transparent;}
#cust-panel::-webkit-scrollbar-thumb{background:#8B6000;border-radius:2px;}

.cust-title{
  font-family:'Cinzel',serif;font-size:11px;
  letter-spacing:0.2em;text-transform:uppercase;
  color:#C8963E;margin-bottom:1rem;
  border-bottom:1px solid rgba(139,96,0,0.3);padding-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;
}
.cust-title span{font-size:10px;color:rgba(200,150,62,0.4);letter-spacing:0.1em;}

.cust-section{
  font-size:10px;font-weight:700;letter-spacing:0.15em;
  text-transform:uppercase;color:rgba(200,150,62,0.5);
  margin:0.9rem 0 0.5rem;display:flex;align-items:center;gap:8px;
}
.cust-section::after{content:'';flex:1;height:1px;background:rgba(139,96,0,0.2);}

.cust-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:0.5rem;}
.cust-preset{
  width:32px;height:32px;border-radius:6px;
  border:2px solid transparent;cursor:pointer;
  transition:border-color 0.15s,transform 0.15s;
  position:relative;overflow:hidden;
  flex-shrink:0;
}
.cust-preset:hover{border-color:#E9C46A;transform:scale(1.08);}
.cust-preset.active{border-color:#E9C46A;box-shadow:0 0 0 1px #E9C46A;}
.cust-preset .preset-del{
  position:absolute;inset:0;background:rgba(139,0,0,0.85);
  display:none;align-items:center;justify-content:center;
  font-size:13px;color:#fff;cursor:pointer;
}
.cust-preset:hover .preset-del.show{display:flex;}
.cust-preset[title]::after{
  content:attr(title);
  position:absolute;bottom:calc(100% + 4px);left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.9);color:#E9C46A;
  font-size:9px;white-space:nowrap;padding:3px 7px;
  border-radius:4px;pointer-events:none;opacity:0;transition:opacity 0.15s;
  font-family:'Lato',sans-serif;letter-spacing:0.05em;
}
.cust-preset:hover[title]::after{opacity:1;}

/* Salvar tema */
.save-theme-row{display:flex;gap:6px;margin-top:0.5rem;}
.save-theme-input{
  flex:1;padding:7px 10px;
  background:rgba(245,224,176,0.05);
  border:1px solid rgba(139,96,0,0.35);border-radius:4px;
  font-size:12px;font-family:'Lato',sans-serif;
  color:#F5E0B0;outline:none;
}
.save-theme-input::placeholder{color:rgba(245,224,176,0.25);}
.save-theme-input:focus{border-color:#C8963E;}
.btn-save-theme{
  padding:7px 12px;background:rgba(200,150,62,0.15);
  border:1px solid #8B6000;border-radius:4px;
  color:#C8963E;font-size:11px;font-weight:700;
  cursor:pointer;white-space:nowrap;letter-spacing:0.06em;
  transition:background 0.15s;
}
.btn-save-theme:hover{background:rgba(200,150,62,0.25);}

.cust-group{margin-bottom:0.9rem;}
.cust-label{
  display:block;font-size:10px;font-weight:700;
  letter-spacing:0.1em;text-transform:uppercase;
  color:rgba(245,224,176,0.55);margin-bottom:5px;
}
.cust-row{display:flex;gap:8px;align-items:center;}
.cust-color{
  width:36px;height:36px;border:1px solid #8B6000;
  border-radius:4px;cursor:pointer;padding:2px;background:transparent;
}
.cust-color::-webkit-color-swatch-wrapper{padding:0;}
.cust-color::-webkit-color-swatch{border:none;border-radius:2px;}
.cust-text{flex:1;}
.cust-input{
  width:100%;padding:7px 10px;
  background:rgba(245,224,176,0.06);
  border:1px solid rgba(139,96,0,0.35);border-radius:4px;
  font-size:12px;font-family:'Lato',sans-serif;
  color:#F5E0B0;outline:none;
}
.cust-input:focus{border-color:#C8963E;}
.cust-range{width:100%;accent-color:#C8963E;cursor:pointer;}
.cust-select{
  width:100%;padding:7px 10px;
  background:rgba(245,224,176,0.05);
  border:1px solid rgba(139,96,0,0.35);border-radius:4px;
  font-size:12px;font-family:'Lato',sans-serif;
  color:#F5E0B0;outline:none;cursor:pointer;appearance:none;
}
.cust-select option{background:#0D0500;color:#F5E0B0;}

.cust-upload-label{
  display:block;width:100%;padding:8px;
  background:rgba(245,224,176,0.04);
  border:1px dashed rgba(139,96,0,0.4);border-radius:4px;
  text-align:center;font-size:11px;color:rgba(245,224,176,0.45);
  cursor:pointer;letter-spacing:0.06em;transition:all 0.15s;
}
.cust-upload-label:hover{background:rgba(245,224,176,0.08);border-color:#C8963E;color:#F5E0B0;}
.cust-upload-label input{display:none;}
.bg-preview{
  width:100%;height:44px;border-radius:4px;
  border:1px solid rgba(139,96,0,0.25);margin-top:5px;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-size:10px;color:rgba(245,224,176,0.3);letter-spacing:0.06em;position:relative;
}
.bg-preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.55;}

.cust-sep{height:1px;background:rgba(139,96,0,0.18);margin:0.75rem 0;}

.btn-cust-apply{
  width:100%;padding:9px;
  background:linear-gradient(135deg,#8B6000,#C8963E);
  color:#1A0800;border:none;border-radius:4px;
  font-size:11px;font-weight:700;letter-spacing:0.12em;
  text-transform:uppercase;cursor:pointer;transition:opacity 0.15s;
}
.btn-cust-apply:hover{opacity:0.9;}
.btn-cust-reset{
  width:100%;padding:7px;margin-top:5px;
  background:transparent;border:1px solid rgba(139,96,0,0.25);
  color:rgba(245,224,176,0.35);border-radius:4px;
  font-size:10px;letter-spacing:0.1em;cursor:pointer;
}
.no-themes-msg{
  font-size:11px;color:rgba(245,224,176,0.3);
  text-align:center;padding:8px;letter-spacing:0.05em;
  font-style:italic;
}

</style>
</head>
<body>

<div class="bg-scene"></div>

<!-- Varal SVG realista -->
<div class="string-lights">

      </g>
    </g>
    <!-- Lâmpadas grupo 2 -->
    <g class="bulb-g2" filter="url(#glow)">
      <g transform="translate(340,26)">

</div>

<!-- Silhuetas de árvores -->
<div class="trees">
  <svg viewBox="0 0 1920 180" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,180 L0,120 Q30,80 60,110 Q90,60 120,100 Q150,40 180,90 Q210,60 240,100 L240,180 Z" fill="#0D0500" opacity="0.8"/>

    <path d="M1480,180 L1480,140 Q1520,90 1550,130 Q1580,80 1610,120 L1610,180 Z" fill="#0D0500" opacity="0.6"/>
    <!-- Cerca -->
    <line x1="440" y1="160" x2="1480" y2="160" stroke="#1A0800" stroke-width="3"/>
    <line x1="440" y1="170" x2="1480" y2="170" stroke="#1A0800" stroke-width="2"/>
    <line x1="480" y1="148" x2="480" y2="175" stroke="#1A0800" stroke-width="4"/>
    <line x1="580" y1="148" x2="580" y2="175" stroke="#1A0800" stroke-width="4"/>
    <line x1="680" y1="148" x2="680" y2="175" stroke="#1A0800" stroke-width="4"/>
    <line x1="780" y1="148" x2="780" y2="175" stroke="#1A0800" stroke-width="4"/>

<script>
const SHEET_ID  = '1bJeP_Awm08ma2TNOo_LU3phWHuAFNTlYVVigvhb7oQY';
const API_URL   = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
const INTERVALO = 10000;
const REFRESH   = 15000;
let mensagens=[], idx=0;

async function buscar(){
  try{
    const r = await fetch(API_URL+'&t='+Date.now());
    const t = await r.text();
    const j = JSON.parse(t.replace(/.*google\.visualization\.Query\.setResponse\(/,'').replace(/\);$/,''));
    const rows = j.table.rows||[];
    const nova = rows.map(r=>({
      timestamp:r.c[0]?.v||'',nome:r.c[1]?.v||'',
      setor:r.c[2]?.v||'',para:r.c[3]?.v||'',mensagem:r.c[4]?.v||''
    })).filter(m=>m.mensagem);
    if(nova.length!==mensagens.length){
      mensagens=nova;
      document.getElementById('topCount').textContent=mensagens.length+' mensagem(ns)';
    }
  }catch(e){console.log(e);}
}

function mostrar(){
  if(!mensagens.length){
    document.getElementById('screen-waiting').style.display='flex';
    document.getElementById('screen-message').style.display='none';
    return;
  }
  if(idx>=mensagens.length)idx=0;
  const m=mensagens[idx];
  document.getElementById('screen-waiting').style.display='none';
  const ms=document.getElementById('screen-message');
  ms.style.display='flex';
  const card=ms.querySelector('.msg-card');
  card.style.animation='none';card.offsetHeight;
  card.style.animation='cardReveal 1s cubic-bezier(0.22,1,0.36,1) both';
  document.getElementById('msgPara').textContent=m.para;
  document.getElementById('msgTexto').textContent='\u201c'+m.mensagem+'\u201d';
  document.getElementById('msgNome').textContent=m.nome;
  document.getElementById('msgSetor').textContent=m.setor;
  const bar=document.getElementById('progressBar');
  bar.style.transition='none';bar.style.width='100%';
  setTimeout(()=>{bar.style.transition=`width ${INTERVALO}ms linear`;bar.style.width='0%';},50);
  idx++;
}

async function iniciar(){
  await buscar();
  mostrar();
  setInterval(mostrar,INTERVALO);
  setInterval(buscar,REFRESH);
}
iniciar();
</script>

    </svg>
    Personalizar

<script>
// ─── STORAGE KEY por página ───────────────────────
const PAGE_KEY = document.title.replace(/[^a-zA-Z]/g,'').toLowerCase().slice(0,20);
document.getElementById('cust-page-id').textContent = PAGE_KEY;
const STORAGE_KEY = 'ofris_temas_' + PAGE_KEY;

// ─── TEMAS PADRÃO ─────────────────────────────────
const PRESETS_DEFAULT = {
  faroeste:{primary:'#3D1F00',accent:'#C8963E',text:'#F5E0B0',bg:'linear-gradient(180deg,#0D0300 0%,#1A0800 15%,#3D1500 35%,#6B2D00 55%,#8B3E00 65%,#4A1A00 80%,#1A0500 100%)',img:null},
  noite:   {primary:'#0A0A2E',accent:'#7B9FFF',text:'#E0E8FF',bg:'linear-gradient(180deg,#020210 0%,#0A0A2E 40%,#1A1A5C 70%,#0A0A2E 100%)',img:null},
  verde:   {primary:'#0A2010',accent:'#40916C',text:'#D0F0E0',bg:'linear-gradient(180deg,#020A05 0%,#0A2010 30%,#1B4332 60%,#0A2010 100%)',img:null},
  dourado: {primary:'#2C200A',accent:'#E9C46A',text:'#FFF5D0',bg:'linear-gradient(180deg,#0D0A00 0%,#2C200A 40%,#5C4010 65%,#2C200A 100%)',img:null},
  vinho:   {primary:'#2A0010',accent:'#D4537E',text:'#FFD0E0',bg:'linear-gradient(180deg,#0D0005 0%,#2A0010 40%,#5C0030 65%,#2A0010 100%)',img:null},
  escuro:  {primary:'#0D0D0D',accent:'#CCCCCC',text:'#FFFFFF',bg:'linear-gradient(180deg,#000000 0%,#0D0D0D 40%,#1A1A1A 65%,#0D0D0D 100%)',img:null},
};

let customBg = null;
let custState = {
  primary:'#3D1F00',accent:'#C8963E',text:'#F5E0B0',
  bg:PRESETS_DEFAULT.faroeste.bg,img:null,opacity:85
};

// ─── CARREGAR TEMAS SALVOS ────────────────────────
function carregarTemasSalvos(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
    const container = document.getElementById('presets-custom');
    const noMsg = document.getElementById('no-themes-msg');
    const keys = Object.keys(saved);
    if(keys.length===0){noMsg.style.display='block';return;}
    noMsg.style.display='none';
    // Limpar exceto o no-themes-msg
    Array.from(container.children).forEach(c=>{if(c.id!=='no-themes-msg')c.remove();});
    keys.forEach(name=>{
      const t = saved[name];
      const el = document.createElement('div');
      el.className='cust-preset';
      el.title=name;
      el.style.background=`linear-gradient(135deg,${t.primary},${t.accent})`;
      el.innerHTML=`<div class="preset-del show" onclick="deletarTema(event,'${name}')">✕</div>`;
      el.addEventListener('click', function(e){if(e.target.classList.contains('preset-del'))return;aplicarTemaCustom(t,this);});
      container.appendChild(el);
    });
  }catch(e){console.log(e);}
}

function salvarTema(){
  const nome = document.getElementById('themeNameInput').value.trim();
  if(!nome){alert('Digite um nome para o tema!');return;}
  const primary = document.getElementById('clrPrimary').value;
  const accent  = document.getElementById('clrAccent').value;
  const text    = document.getElementById('clrText').value;
  const opacity = parseInt(document.getElementById('rngOpacity').value);
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
    saved[nome] = {primary,accent,text,opacity,bg:custState.bg,img:customBg||null};
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
    document.getElementById('themeNameInput').value='';
    carregarTemasSalvos();
    // Feedback visual
    const btn = document.querySelector('.btn-save-theme');
    const orig = btn.textContent;
    btn.textContent='Salvo!';btn.style.color='#40916C';
    setTimeout(()=>{btn.textContent=orig;btn.style.color='';},1500);
  }catch(e){alert('Erro ao salvar tema.');}
}

function deletarTema(e, nome){
  e.stopPropagation();
  if(!confirm('Excluir o tema "'+nome+'"?'))return;
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
    delete saved[nome];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
    carregarTemasSalvos();
  }catch(e){console.log(e);}
}

function aplicarTemaCustom(t, el){
  document.querySelectorAll('.cust-preset').forEach(e=>e.classList.remove('active'));
  if(el)el.classList.add('active');
  document.getElementById('clrPrimary').value = t.primary;
  document.getElementById('txtPrimary').value = t.primary;
  document.getElementById('clrAccent').value  = t.accent;
  document.getElementById('txtAccent').value  = t.accent;
  if(t.text){document.getElementById('clrText').value=t.text;document.getElementById('txtText').value=t.text;}
  if(t.opacity){document.getElementById('rngOpacity').value=t.opacity;document.getElementById('opacLabel').textContent=t.opacity+'%';}
  customBg = t.img || null;
  if(customBg){
    document.getElementById('bgPreview').innerHTML=`<img src="${customBg}" alt="bg">`;
  } else {
    document.getElementById('bgPreview').innerHTML='sem imagem';
  }
  custState.bg = t.bg || PRESETS_DEFAULT.faroeste.bg;
  aplicarPersonalizacao();
}

// ─── TEMAS PADRÃO ─────────────────────────────────
function aplicarPreset(nome, el){
  const p = PRESETS_DEFAULT[nome];
  document.querySelectorAll('.cust-preset').forEach(e=>e.classList.remove('active'));
  if(el)el.classList.add('active');
  document.getElementById('clrPrimary').value = p.primary;
  document.getElementById('txtPrimary').value = p.primary;
  document.getElementById('clrAccent').value  = p.accent;
  document.getElementById('txtAccent').value  = p.accent;
  document.getElementById('clrText').value    = p.text;
  document.getElementById('txtText').value    = p.text;
  customBg = null;
  document.getElementById('bgPreview').innerHTML = 'sem imagem';
  custState.bg = p.bg;
  aplicarPersonalizacao();
}

// ─── SYNC CORES ───────────────────────────────────
function syncFromPicker(clrId, txtId){
  document.getElementById(txtId).value = document.getElementById(clrId).value;
}
function syncFromText(clrId, txtId){
  const v = document.getElementById(txtId).value;
  if(/^#[0-9A-Fa-f]{6}$/.test(v)) document.getElementById(clrId).value = v;
}

// ─── FUNDO ────────────────────────────────────────
function carregarBg(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    customBg = e.target.result;
    document.getElementById('bgPreview').innerHTML=`<img src="${customBg}" alt="bg">`;
  };
  reader.readAsDataURL(file);
}
function removerBg(){
  customBg=null;
  document.getElementById('bgPreview').innerHTML='sem imagem';
  const inp=document.querySelector('#cust-panel input[type=file]');
  if(inp)inp.value='';
}

// ─── APLICAR ──────────────────────────────────────
function aplicarPersonalizacao(){
  const primary = document.getElementById('clrPrimary').value;
  const accent  = document.getElementById('clrAccent').value;
  const text    = document.getElementById('clrText').value;
  const opacity = parseInt(document.getElementById('rngOpacity').value)/100;
  custState = {...custState, primary, accent, text, opacity:parseInt(document.getElementById('rngOpacity').value)};

  // Fundo
  const bgEl = document.querySelector('.bg') || document.querySelector('.bg-scene') || document.body;
  if(customBg){
    bgEl.style.backgroundImage=`url("${customBg}")`;
    bgEl.style.backgroundSize='cover';
    bgEl.style.backgroundPosition='center';
    bgEl.style.background='';
    bgEl.style.opacity=opacity;
  } else {
    bgEl.style.backgroundImage='';
    bgEl.style.background=custState.bg||PRESETS_DEFAULT.faroeste.bg;
    bgEl.style.opacity=opacity;
  }

  // Injetar CSS dinâmico
  let s=document.getElementById('cust-live-style');
  if(!s){s=document.createElement('style');s.id='cust-live-style';document.head.appendChild(s);}
  s.textContent=`
    .poster-band,.top-bar,.ph-top,.card-header,.intro-hero,.result-hero{background:${primary} !important;}
    .poster-wanted-word,.wait-waited,.wait-title span,.msg-para,.msg-nome,.header-title span,.score-big{color:${accent} !important;}
    .cust-color{accent-color:${accent};}
    .progress-bar,.score-bar-fill,.btn-send,.btn-begin,.btn-cust-apply{background:linear-gradient(135deg,${primary},${accent}) !important;color:${primary==='#0D0D0D'?'#fff':'#1A0800'} !important;}
    .deco-line-diamond,.msg-divider-diamond{background:${accent} !important;}
    .top-brand,.cust-title,.event-label,.field label,.cust-label,.cust-section,.cust-preset-title{color:${accent} !important;}
    .poster-nome,.msg-texto,.header-title,.wait-wanted{color:${text} !important;}
    .field input,.field select,.field textarea,.cust-input,.save-theme-input{color:${text} !important;border-color:${accent}44 !important;}
    .card,.card-header,.msg-card,.wanted-poster{border-color:${accent} !important;}
    .rope-deco{background:repeating-linear-gradient(90deg,${primary} 0,${primary} 6px,${accent} 6px,${accent} 10px) !important;}
    :root{--brand:${primary};--gold:${accent};--gold2:${accent};}
  `;
}

// ─── RESET ────────────────────────────────────────
function resetPersonalizacao(){
  document.getElementById('cust-live-style')?.remove();
  const bgEl=document.querySelector('.bg')||document.querySelector('.bg-scene')||document.body;
  bgEl.style='';
  customBg=null;
  document.getElementById('bgPreview').innerHTML='sem imagem';
  document.getElementById('clrPrimary').value='#3D1F00';document.getElementById('txtPrimary').value='#3D1F00';
  document.getElementById('clrAccent').value='#C8963E'; document.getElementById('txtAccent').value='#C8963E';
  document.getElementById('clrText').value='#F5E0B0';  document.getElementById('txtText').value='#F5E0B0';
  document.getElementById('rngOpacity').value='85';document.getElementById('opacLabel').textContent='85%';
  document.querySelectorAll('.cust-preset').forEach((e,i)=>e.classList.toggle('active',i===0));
  custState={primary:'#3D1F00',accent:'#C8963E',text:'#F5E0B0',bg:PRESETS_DEFAULT.faroeste.bg,img:null,opacity:85};
}

function togglePanel(){
  document.getElementById('cust-panel').classList.toggle('open');
}

// Inicializar
carregarTemasSalvos();
</script>
