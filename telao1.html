<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telão — Correio Diamante · Entre Laços 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Cinzel:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;}
body{font-family:'Lato',sans-serif;background:linear-gradient(135deg,#1A0A00 0%,#3D1F00 35%,#6B3A00 65%,#2C1500 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
.lights{position:fixed;top:0;left:0;right:0;height:120px;pointer-events:none;z-index:2;}
.lights svg{width:100%;height:120px;}
@keyframes flicker1{0%,89%,91%,95%,100%{opacity:1;}90%,94%{opacity:0.5;}}
@keyframes flicker2{0%,44%,46%,100%{opacity:0.9;}45%{opacity:0.3;}}
@keyframes flicker3{0%,70%,73%,100%{opacity:1;}71%,72%{opacity:0.4;}}
.g1{animation:flicker1 9s infinite;}
.g2{animation:flicker2 13s infinite 2s;}
.g3{animation:flicker3 17s infinite 5s;}
.bottom-deco{position:fixed;bottom:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#C8963E,#E9C46A,#8B6914,#E9C46A,#C8963E);z-index:0;}
.trees{position:fixed;bottom:0;left:0;right:0;height:180px;z-index:1;pointer-events:none;}
.trees svg{width:100%;height:180px;}
.top-bar{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 2.5rem;z-index:10;background:linear-gradient(180deg,rgba(13,3,0,0.8),transparent);}
.top-brand{font-family:'Cinzel',serif;color:#C8963E;font-size:14px;letter-spacing:0.2em;text-transform:uppercase;}
.top-count{font-size:12px;color:rgba(200,150,62,0.4);letter-spacing:0.12em;}
#screen-waiting{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;text-align:center;padding:2rem;}
.wait-envelope{width:120px;height:84px;margin:0 auto 2rem;animation:floatEnv 4s ease-in-out infinite;}
@keyframes floatEnv{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-18px) rotate(1deg);}}
.wait-title{font-family:'Playfair Display',serif;font-style:italic;color:#F5E0B0;font-size:72px;margin-bottom:12px;text-shadow:0 4px 20px rgba(0,0,0,0.5);}
.wait-title span{color:#E9C46A;}
.wait-sub{font-family:'Cinzel',serif;color:rgba(200,150,62,0.5);font-size:14px;letter-spacing:0.3em;text-transform:uppercase;}
#screen-message{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:5;padding:8rem 4rem 5rem;}
.msg-card{background:linear-gradient(145deg,rgba(44,18,0,0.96),rgba(65,28,0,0.93));border:1px solid #8B6000;max-width:900px;width:100%;padding:4rem;position:relative;box-shadow:0 0 0 1px rgba(139,96,0,0.3),0 40px 120px rgba(0,0,0,0.6);animation:cardReveal 0.8s cubic-bezier(0.22,1,0.36,1) both;}
@keyframes cardReveal{from{opacity:0;transform:translateY(40px) scale(0.95);}to{opacity:1;transform:translateY(0) scale(1);}}
.msg-card::before,.msg-card::after{content:'';position:absolute;width:40px;height:40px;border-color:#8B6000;border-style:solid;}
.msg-card::before{top:16px;left:16px;border-width:1px 0 0 1px;}
.msg-card::after{bottom:16px;right:16px;border-width:0 1px 1px 0;}
.msg-seal{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#6B0000,#8B1A1A);border:2px solid #C8963E;margin:0 auto 1.5rem;display:flex;align-items:center;justify-content:center;}
.msg-seal svg{width:28px;height:28px;}
.msg-para-label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.3em;color:#8B6000;text-transform:uppercase;text-align:center;margin-bottom:6px;}
.msg-para{font-family:'Playfair Display',serif;font-style:italic;color:#E9C46A;font-size:38px;text-align:center;margin-bottom:2rem;line-height:1.2;}
.msg-divider{display:flex;align-items:center;gap:16px;margin-bottom:2rem;}
.msg-divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(139,96,0,0.5),transparent);}
.msg-divider-diamond{width:10px;height:10px;background:#C8963E;transform:rotate(45deg);flex-shrink:0;}
.msg-texto{font-family:'Playfair Display',serif;font-style:italic;color:#F5E0B0;font-size:30px;line-height:1.65;text-align:center;margin-bottom:2.5rem;}
.msg-assinatura{text-align:center;}
.msg-de{font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.25em;color:#8B6000;text-transform:uppercase;margin-bottom:5px;}
.msg-nome{font-family:'Playfair Display',serif;color:#E9C46A;font-size:26px;font-weight:700;}
.msg-setor{font-size:13px;color:rgba(245,224,176,0.45);margin-top:3px;letter-spacing:0.08em;}
.progress-wrap{position:fixed;bottom:5px;left:0;right:0;height:4px;background:rgba(139,96,0,0.15);z-index:10;}
.progress-bar{height:4px;background:linear-gradient(90deg,#8B6000,#C8963E,#E9C46A);}
</style>
</head>

    </g>

      <g transform="translate(740,8)"><rect x="-4" y="-16" width="8" height="6" rx="1" fill="#4A2800"/><ellipse cx="0" cy="0" rx="9" ry="11" fill="url(#b)"/></g>
      <g transform="translate(1160,38)"><rect x="-4" y="-16" width="8" height="6" rx="1" fill="#4A2800"/><ellipse cx="0" cy="0" rx="9" ry="11" fill="url(#b)"/></g>
      <g transform="translate(1580,10)"><rect x="-4" y="-16" width="8" height="6" rx="1" fill="#4A2800"/><ellipse cx="0" cy="0" rx="9" ry="11" fill="url(#b)"/></g>
    </g>
    <g class="g3" filter="url(#glow)">
      <g transform="translate(240,42)"><rect x="-4" y="-16" width="8" height="6" rx="1" fill="#4A2800"/><ellipse cx="0" cy="0" rx="9" ry="11" fill="url(#b)"/></g>
      <g transform="translate(650,16)"><rect x="-4" y="-16" width="8" height="6" rx="1" fill="#4A2800"/><ellipse cx="0" cy="0" rx="9" ry="11" fill="url(#b)"/></g>
      <g transform="translate(1070,28)"><rect x="-4" y="-16" width="8" height="6" rx="1" fill="#4A2800"/><ellipse cx="0" cy="0" rx="9" ry="11" fill="url(#b)"/></g>
      <g transform="translate(1480,6)"><rect x="-4" y="-16" width="8" height="6" rx="1" fill="#4A2800"/><ellipse cx="0" cy="0" rx="9" ry="11" fill="url(#b)"/></g>
    </g>
  </svg>
</div>

</div>
<div class="top-bar">
  <div class="top-brand">Correio Diamante · Entre Laços 2026</div>
  <div class="top-count" id="topCount"></div>
</div>
<div id="screen-waiting">
  <div class="wait-envelope">
    <svg viewBox="0 0 120 84" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="118" height="82" rx="3" fill="#2C1200" stroke="#C8963E" stroke-width="1.5"/>
      <path d="M1 1 L60 48 L119 1" stroke="#E9C46A" stroke-width="1.5" fill="none"/>
      <path d="M1 83 L42 44" stroke="#8B6000" stroke-width="1" opacity="0.5"/>
      <path d="M119 83 L78 44" stroke="#8B6000" stroke-width="1" opacity="0.5"/>
      <circle cx="60" cy="60" r="12" fill="#6B0000" stroke="#C8963E" stroke-width="1"/>
      <path d="M54 60 L58 64 L67 54" stroke="#E9C46A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="wait-title">Correio <span>Diamante</span></div>
  <div class="wait-sub">Aguardando mensagens</div>
</div>
<div id="screen-message">
  <div class="msg-card" id="msgCard">
    <div class="msg-seal"><svg viewBox="0 0 28 28" fill="none"><path d="M14 2 L16 10 L24 10 L18 15 L20 23 L14 18 L8 23 L10 15 L4 10 L12 10 Z" fill="#E9C46A"/></svg></div>
    <div class="msg-para-label">Para</div>
    <div class="msg-para" id="msgPara">—</div>
    <div class="msg-divider"><div class="msg-divider-line"></div><div class="msg-divider-diamond"></div><div class="msg-divider-line"></div></div>
    <div class="msg-texto" id="msgTexto">—</div>
    <div class="msg-assinatura">
      <div class="msg-de">Com carinho,</div>
      <div class="msg-nome" id="msgNome">—</div>
      <div class="msg-setor" id="msgSetor">—</div>
    </div>
  </div>
</div>
<div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:100%"></div></div>
<div class="bottom-deco"></div>
<script>
const SHEET_ID='1bJeP_Awm08ma2TNOo_LU3phWHuAFNTlYVVigvhb7oQY';
const API_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
const INTERVALO=7000;
const REFRESH=15000;
let mensagens=[],idx=0;

function receberDados(data){
  try{
    const rows=data.table?.rows||[];
    const nova=rows.map(r=>({
      nome:r.c[1]?.v||'',setor:r.c[2]?.v||'',
      para:r.c[3]?.v||'',mensagem:r.c[4]?.v||''
    })).filter(m=>m.mensagem);
    if(nova.length!==mensagens.length){
      mensagens=nova;
      document.getElementById('topCount').textContent=mensagens.length+' mensagem(ns)';
    }
  }catch(e){console.log('Erro:',e);}
}

function buscar(){
  const s=document.createElement('script');
  s.src=API_URL+'&callback=receberDados&t='+Date.now();
  document.head.appendChild(s);
  setTimeout(()=>s.remove(),5000);
}

function mostrar(){
  if(!mensagens.length){
    document.getElementById('screen-waiting').style.display='flex';
    document.getElementById('screen-message').style.display='none';
    return;
  }
  if(idx>=mensagens.length)idx=0;
  const m=mensagens[idx];
  document.getElementById('screen-waiting').style.display='none';
  const ms=document.getElementById('screen-message');
  ms.style.display='flex';
  const card=document.getElementById('msgCard');
  card.style.animation='none';card.offsetHeight;
  card.style.animation='cardReveal 0.8s cubic-bezier(0.22,1,0.36,1) both';
  document.getElementById('msgPara').textContent=m.para;
  document.getElementById('msgTexto').textContent='\u201c'+m.mensagem+'\u201d';
  document.getElementById('msgNome').textContent=m.nome;
  document.getElementById('msgSetor').textContent=m.setor;
  const bar=document.getElementById('progressBar');
  bar.style.transition='none';bar.style.width='100%';
  setTimeout(()=>{bar.style.transition=`width ${INTERVALO}ms linear`;bar.style.width='0%';},50);
  idx++;
}

buscar();
setTimeout(()=>{mostrar();setInterval(mostrar,INTERVALO);},1000);
setInterval(buscar,REFRESH);
</script>
</body>
